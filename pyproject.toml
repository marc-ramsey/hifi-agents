[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-agent"
version = "0.2.0"
description = "SearXNG persistent memory agent — SQLite + numpy"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "numpy",
    "pydantic",
    "mcp",
]

[project.scripts]
search-agent = "search_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
