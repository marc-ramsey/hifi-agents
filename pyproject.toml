[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "search-agent"
version = "0.1.0"
description = "SearXNG Persistent Memory Architecture"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "pydantic",
    "sentence-transformers",
    "numpy",
    "mcp",
]

[project.scripts]
search-agent = "search_agent.__main__:main"
